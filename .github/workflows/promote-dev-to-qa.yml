# CI/CD promotion pipeline: Dev -> QA with an approval gate.
# Adapted from the Day 20 capstone template for the Meridian Residences app
# (FastAPI backend + Vite/React frontend, both Dockerized - see
# docker-compose.yml). build-and-test runs the real test/build steps for
# both services and publishes both images to GHCR; deploy-dev rolls them
# out automatically; deploy-qa is identical but requires a human reviewer
# via the "qa" GitHub Environment.
#
# Before deploy-dev/deploy-qa can succeed, set these up in the repo's
# Settings:
#   - Settings -> Environments: create "dev" and "qa". On "qa", add a
#     required reviewer - that's what makes deploy-qa pause for approval.
#   - Settings -> Secrets and variables -> Actions: add EC2_HOST,
#     EC2_USERNAME, EC2_SSH_KEY (and QA_HOST/QA_USERNAME/QA_SSH_KEY if QA
#     is a separate host - reuse the DEV_* secrets there otherwise).
# build-and-test needs no extra secrets - it uses the automatic
# GITHUB_TOKEN to publish to ghcr.io.
#
# Sources:
#   https://docs.github.com/en/actions/get-started/understand-github-actions
#   https://docs.github.com/en/actions/how-tos/managing-workflow-runs-and-deployments/managing-deployments/managing-environments-for-deployment

name: Promote Dev to QA

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase image names; github.repository preserves
      # the repo's actual casing (Meridian-Residences), so lowercase it
      # once here for both image tags below.
      - name: Compute lowercase repository name
        run: echo "REPO_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Extract backend image metadata
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}-backend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          # Build context is the repo root, not ./backend - backend/Dockerfile
          # also COPYs alembic.ini and database/ from the root (see that
          # file's own header comment and docker-compose.yml's backend
          # service, which uses the same context/dockerfile pairing).
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.REPO_LC }}-frontend
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy-dev:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy to Dev
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/meridian-residences # [PLACEHOLDER — path to this repo's docker-compose.yml on the Dev host]
            docker compose pull backend frontend
            docker compose up -d --force-recreate backend frontend
            docker compose ps
            docker system prune -af

  deploy-qa:
    needs: deploy-dev
    runs-on: ubuntu-latest
    # Create this "qa" environment in Settings -> Environments and add a
    # required reviewer there — that's what makes this job pause for a
    # human approval instead of running straight through.
    environment: qa
    steps:
      - name: Deploy to QA
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.QA_HOST }}
          username: ${{ secrets.QA_USERNAME }}
          key: ${{ secrets.QA_SSH_KEY }}
          port: ${{ secrets.QA_SSH_PORT || 22 }}
          script: |
            set -e
            cd /home/ubuntu/meridian-residences # [PLACEHOLDER — path to this repo's docker-compose.yml on the QA host]
            docker compose pull backend frontend
            docker compose up -d --force-recreate backend frontend
            docker compose ps
