services:
  postgres:
    image: postgres:16-alpine
    container_name: meridian-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridian_residences}
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meridian_postgres_data:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./database/docker-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: meridian-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-meridian_residences}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-do-not-commit}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_TRIAGE_API_URL: ${AI_TRIAGE_API_URL:-http://ollama:11434/api/generate}
      AI_TRIAGE_API_KEY: ${AI_TRIAGE_API_KEY:-}
      AI_TRIAGE_MODEL: ${AI_TRIAGE_MODEL:-llama3.2}
      AI_TRIAGE_TIMEOUT_SECONDS: ${AI_TRIAGE_TIMEOUT_SECONDS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"

  ollama:
    image: ollama/ollama:latest
    container_name: meridian-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: meridian-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  meridian_postgres_data:
  ollama_data:
